<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="860" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="24" y="112" width="130" height="76" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="89" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Board</text>
  <text x="89" y="168" text-anchor="middle" font-size="12" fill="#6b7280">serial console</text>
  <line x1="154" y1="150" x2="262" y2="150" stroke="#6b7280" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="208" y="140" text-anchor="middle" font-size="12" fill="#6b7280">FTDI USB-UART</text>
  <rect x="264" y="88" width="210" height="124" rx="12" fill="#fff7ed" stroke="#ea7a3c" stroke-width="2"/>
  <text x="369" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">UartHub.exe</text>
  <text x="369" y="147" text-anchor="middle" font-size="12" fill="#7c2d12">owns the COM port</text>
  <text x="369" y="167" text-anchor="middle" font-size="12" fill="#7c2d12">one TCP port per cable</text>
  <text x="369" y="187" text-anchor="middle" font-size="12" fill="#7c2d12">logging · event detection</text>
  <rect x="600" y="40" width="236" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="718" y="69" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">You (terminal)</text>
  <text x="718" y="91" text-anchor="middle" font-size="12" fill="#1e40af">TeraTerm · PuTTY · MobaXterm</text>
  <line x1="474" y1="118" x2="598" y2="80" stroke="#6b7280" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="508" y="126" font-size="11.5" fill="#6b7280">telnet 127.0.0.1:7001</text>
  <rect x="600" y="190" width="236" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="718" y="219" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">Claude Code</text>
  <text x="718" y="241" text-anchor="middle" font-size="12" fill="#5b21b6">in WSL or Git Bash</text>
  <line x1="474" y1="182" x2="598" y2="220" stroke="#6b7280" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="508" y="178" font-size="11.5" fill="#6b7280">uart skill / CLI</text>
  <text x="718" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">One console, shared</text>
  <text x="718" y="156" text-anchor="middle" font-size="12" fill="#b91c1c">Human input always wins —</text>
  <text x="718" y="174" text-anchor="middle" font-size="12" fill="#b91c1c">Claude types only at an idle prompt</text>
  <line x1="369" y1="212" x2="369" y2="248" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <rect x="284" y="250" width="170" height="34" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="369" y="272" text-anchor="middle" font-size="12" fill="#374151">logs  D:\uart_logs</text>
</svg>
